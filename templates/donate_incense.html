<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上香祈福 - 赛博神宫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .page-title {
            font-size: 2.5rem;
            color: #ffd700;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* ========== 纯CSS三根香 ========== */
        .incense-container {
            width: 200px;
            height: 300px;
            margin: 0 auto 40px;
            position: relative;
        }

        /* 香炉底座 */
        .incense-img::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 30px;
            background: linear-gradient(135deg, #8b4513, #d2691e);
            border-radius: 10px 10px 0 0;
            border: 2px solid #ffd700;
        }

        /* 三根香主体 */
        .incense-img {
            width: 100%;
            height: 100%;
            position: relative;
            transition: all 0.5s ease;
        }

        .incense-stick {
            position: absolute;
            bottom: 30px;
            width: 6px;
            height: 180px;
            background: linear-gradient(to top, #8b4513, #d2691e);
            border-radius: 3px;
        }

        .incense-stick:nth-child(1) { left: 70px; }
        .incense-stick:nth-child(2) { left: 97px; height: 200px; }
        .incense-stick:nth-child(3) { left: 124px; }

        /* 香灰 */
        .incense-ash {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 12px;
            background: #cccccc;
            border-radius: 2px;
            opacity: 0;
            transition: all 0.5s ease;
        }

        /* 火焰 */
        .flame {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 20px;
            background: linear-gradient(to top, #ff4500, #ffd700, #ffff00);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            opacity: 0;
            transition: all 0.5s ease;
        }

        /* 烟雾 */
        .smoke {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            opacity: 0;
            filter: blur(5px);
        }

        /* 未点亮状态 */
        .incense-off {
            filter: brightness(0.2);
            opacity: 0.5;
        }

        /* 点亮状态 */
        .incense-on {
            filter: brightness(1.3);
        }

        .incense-on .incense-stick {
            background: linear-gradient(to top, #d2691e, #ffd700);
        }

        .incense-on .incense-ash {
            opacity: 1;
        }

        .incense-on .flame {
            opacity: 1;
            animation: flicker 0.5s infinite alternate;
        }

        .incense-on .smoke {
            opacity: 1;
            animation: smoke-rise 3s infinite ease-out;
        }

        .incense-on .smoke:nth-child(2) { animation-delay: 1s; }
        .incense-on .smoke:nth-child(3) { animation-delay: 2s; }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.1); }
        }

        @keyframes smoke-rise {
            0% { opacity: 0.6; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-60px); }
        }

        .countdown {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 15px;
            border-radius: 20px;
            color: #ffd700;
            font-size: 1.2rem;
            display: none;
        }

        /* ========== 修改后的金额选择器（完全匹配你的截图） ========== */
        .amount-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            max-width: 900px;
            margin: 0 auto 30px;
        }

        .amount-btn {
            padding: 40px 20px;
            border: 2px solid #ffffff;
            background: #0a0a0f;
            color: #ffffff;
            border-radius: 0;
            font-size: 2.2rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .amount-btn:hover, .amount-btn.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }

        /* 姓名输入 */
        .name-input {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            border: 2px solid #333;
            background: #1a1a2e;
            color: #fff;
            border-radius: 8px;
            font-size: 1.1rem;
            margin-bottom: 30px;
            text-align: center;
        }

        /* 上香按钮 */
        .donate-btn {
            padding: 15px 60px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
            border: none;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .donate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        .donate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 功德流区域 */
        .merit-stream {
            margin-top: 60px;
            text-align: left;
        }

        .merit-title {
            font-size: 1.5rem;
            color: #ffd700;
            margin-bottom: 20px;
            text-align: center;
        }

        .merit-list {
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .merit-item {
            padding: 10px;
            border-bottom: 1px solid #333;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .merit-name {
            color: #ffd700;
            font-weight: bold;
        }

        .merit-time {
            color: #666;
            font-size: 0.8rem;
            margin-left: 10px;
        }

        /* 全局浮动通知 */
        .notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notification {
            padding: 15px 25px;
            background: rgba(0, 0, 0, 0.8);
            border-left: 4px solid #ffd700;
            color: #fff;
            border-radius: 5px;
            animation: notifyIn 0.3s ease, notifyOut 0.3s ease 2.7s forwards;
        }

        @keyframes notifyIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes notifyOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">🙏 上香祈福</h1>

        <!-- 纯CSS三根香 -->
        <div class="incense-container">
            <div id="incenseImg" class="incense-img incense-off">
                <div class="incense-stick">
                    <div class="flame"></div>
                    <div class="incense-ash"></div>
                    <div class="smoke"></div>
                    <div class="smoke"></div>
                    <div class="smoke"></div>
                </div>
                <div class="incense-stick">
                    <div class="flame"></div>
                    <div class="incense-ash"></div>
                    <div class="smoke"></div>
                    <div class="smoke"></div>
                    <div class="smoke"></div>
                </div>
                <div class="incense-stick">
                    <div class="flame"></div>
                    <div class="incense-ash"></div>
                    <div class="smoke"></div>
                    <div class="smoke"></div>
                    <div class="smoke"></div>
                </div>
            </div>
            <div id="countdown" class="countdown">60s</div>
        </div>

        <!-- 修改后的三个香档位 -->
        <div class="amount-selector">
            <button class="amount-btn active" data-amount="1">心誠香 1元</button>
            <button class="amount-btn" data-amount="6">平安香 6元</button>
            <button class="amount-btn" data-amount="18">福報香 18元</button>
        </div>

        <!-- 姓名输入 -->
        <input type="text" id="donorName" class="name-input" placeholder="您的法名（留空为匿名）">

        <!-- 上香按钮 -->
        <button id="donateBtn" class="donate-btn">敬上清香</button>

        <!-- 功德流 -->
        <div class="merit-stream">
            <h2 class="merit-title">✨ 最近功德</h2>
            <div id="meritList" class="merit-list">
                <div class="merit-item">
                    <span class="merit-name">匿名信众</span>
                    <span>敬香一炷，功德+1</span>
                    <span class="merit-time">刚刚</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 通知容器 -->
    <div id="notificationContainer" class="notification-container"></div>

    <script>
        // 全局变量
        let selectedAmount = 1;
        let incenseTimer = null;
        let remainingTime = 0;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 金额选择逻辑
            const amountBtns = document.querySelectorAll('.amount-btn');

            amountBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    amountBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedAmount = parseFloat(this.dataset.amount);
                });
            });

            // 上香按钮点击
            document.getElementById('donateBtn').addEventListener('click', handleDonate);

            // 检查URL中是否有付款成功标记
            checkPaymentSuccess();
        });

        // 处理捐赠（核心修改：仅替换付款链接）
        async function handleDonate() {
            const name = document.getElementById('donorName').value.trim() || '匿名信眾';
            const btn = document.getElementById('donateBtn');

            // 禁用按钮防止重复点击
            btn.disabled = true;
            btn.textContent = '处理中...';

            try {
                let payUrl = '';
                // 按档位匹配对应付款链接
                if (selectedAmount === 1) {
                    payUrl = 'https://www.checkout-ds24.com/product/691489';
                } else if (selectedAmount === 6) {
                    payUrl = 'https://www.checkout-ds24.com/product/691608';
                } else if (selectedAmount === 18) {
                    payUrl = 'https://www.checkout-ds24.com/product/691609';
                } else {
                    throw new Error('该档位暂未开放，敬请期待');
                }

                // 跳转到对应付款页
                showNotification('正在跳转到付款页面...');
                setTimeout(() => {
                    window.location.href = payUrl;
                }, 1000);

            } catch (error) {
                showNotification(error.message, 'error');
                btn.disabled = false;
                btn.textContent = '敬上清香';
            }
        }

        // 检查URL中是否有付款成功标记
        function checkPaymentSuccess() {
            const urlParams = new URLSearchParams(window.location.search);
            const isSuccess = urlParams.get('success');
            const orderNo = urlParams.get('order_no');
            const name = urlParams.get('name');

            if (isSuccess === '1' && orderNo) {
                showNotification(`${name || '匿名信众'} 上香成功，功德+1`);
                startIncenseCountdown();
                addMeritItem(name || '匿名信众', '敬香一炷');

                // 清理URL参数
                window.history.replaceState({}, document.title, '/donate/incense');
            }
        }

        // 开始上香倒计时
        function startIncenseCountdown() {
            const incenseImg = document.getElementById('incenseImg');
            const countdownEl = document.getElementById('countdown');

            // 切换到燃烧状态
            incenseImg.classList.remove('incense-off');
            incenseImg.classList.add('incense-on');
            countdownEl.style.display = 'block';

            remainingTime = 60;
            countdownEl.textContent = `${remainingTime}s`;

            // 清除之前的定时器
            if (incenseTimer) clearInterval(incenseTimer);

            // 开始倒计时
            incenseTimer = setInterval(() => {
                remainingTime--;
                countdownEl.textContent = `${remainingTime}s`;

                if (remainingTime <= 0) {
                    clearInterval(incenseTimer);
                    // 切换回熄灭状态
                    incenseImg.classList.remove('incense-on');
                    incenseImg.classList.add('incense-off');
                    countdownEl.style.display = 'none';
                }
            }, 1000);
        }

        // 显示浮动通知
        function showNotification(message, type = 'success') {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;

            if (type === 'error') {
                notification.style.borderLeftColor = '#ff4444';
            }

            container.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // 添加功德流项目
        function addMeritItem(name, type) {
            const meritList = document.getElementById('meritList');
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const item = document.createElement('div');
            item.className = 'merit-item';
            item.innerHTML = `
                <span class="merit-name">${name}</span>
                <span>${type}，功德+1</span>
                <span class="merit-time">${timeStr}</span>
            `;

            meritList.prepend(item);

            if (meritList.children.length > 20) {
                meritList.removeChild(meritList.lastChild);
            }
        }
    </script>
</body>
</html>
