<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随心供养 - 赛博神宫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .page-title {
            font-size: 2.5rem;
            color: #ffd700;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* ========== 纯CSS金色莲花 ========== */
        .offering-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 40px;
            position: relative;
        }

        .offering-img {
            width: 100%;
            height: 100%;
            position: relative;
            transition: all 0.5s ease;
        }

        /* 莲花花瓣 */
        .petal {
            position: absolute;
            bottom: 20px;
            left: 50%;
            width: 30px;
            height: 80px;
            background: linear-gradient(to top, #ffd700, #ffff00);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transform-origin: bottom center;
            transition: all 0.5s ease;
        }

        .petal:nth-child(1) { transform: translateX(-50%) rotate(0deg); }
        .petal:nth-child(2) { transform: translateX(-50%) rotate(30deg); }
        .petal:nth-child(3) { transform: translateX(-50%) rotate(-30deg); }
        .petal:nth-child(4) { transform: translateX(-50%) rotate(60deg); }
        .petal:nth-child(5) { transform: translateX(-50%) rotate(-60deg); }
        .petal:nth-child(6) { transform: translateX(-50%) rotate(90deg); }
        .petal:nth-child(7) { transform: translateX(-50%) rotate(-90deg); }

        /* 莲花中心 */
        .lotus-center {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: #ff9900;
            border-radius: 50%;
            transition: all 0.5s ease;
        }

        /* 未点亮状态 */
        .offering-off {
            filter: brightness(0.2);
            opacity: 0.5;
        }

        .offering-off .petal {
            height: 40px;
            transform: translateX(-50%) rotate(0deg) scale(0.8);
        }

        /* 点亮状态 */
        .offering-on {
            filter: brightness(1.3);
            animation: lotus-glow 2s infinite alternate;
        }

        .offering-on .petal {
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .offering-on .lotus-center {
            box-shadow: 0 0 20px rgba(255, 153, 0, 0.8);
        }

        @keyframes lotus-glow {
            0% { filter: brightness(1.2); }
            100% { filter: brightness(1.4); }
        }

        /* 金额选择 */
        .amount-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .amount-btn {
            padding: 12px 25px;
            border: 2px solid #333;
            background: #1a1a2e;
            color: #fff;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3;
        }

        .amount-btn:hover, .amount-btn.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }

        .custom-amount {
            width: 100%;
            max-width: 200px;
            padding: 12px;
            border: 2px solid #333;
            background: #1a1a2e;
            color: #fff;
            border-radius: 8px;
            font-size: 1.1rem;
            text-align: center;
            margin-top: 10px;
        }

        /* 姓名和备注输入 */
        .name-input, .remark-input {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            border: 2px solid #333;
            background: #1a1a2e;
            color: #fff;
            border-radius: 8px;
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .remark-input {
            height: 80px;
            resize: none;
        }

        .input-hint {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        /* 供养按钮 */
        .donate-btn {
            padding: 15px 60px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
            border: none;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .donate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        .donate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 功德流区域 */
        .merit-stream {
            margin-top: 60px;
            text-align: left;
        }

        .merit-title {
            font-size: 1.5rem;
            color: #ffd700;
            margin-bottom: 20px;
            text-align: center;
        }

        .merit-list {
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .merit-item {
            padding: 10px;
            border-bottom: 1px solid #333;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .merit-name {
            color: #ffd700;
            font-weight: bold;
        }

        .merit-time {
            color: #666;
            font-size: 0.8rem;
            margin-left: 10px;
        }

        /* 全局浮动通知 */
        .notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notification {
            padding: 15px 25px;
            background: rgba(0, 0, 0, 0.8);
            border-left: 4px solid #ffd700;
            color: #fff;
            border-radius: 5px;
            animation: notifyIn 0.3s ease, notifyOut 0.3s ease 2.7s forwards;
        }

        @keyframes notifyIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes notifyOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100px); }
        }

        /* 测试模式提示 */
        .test-mode-notice {
            margin-top: 20px;
            padding: 10px;
            background: rgba(255, 100, 100, 0.1);
            border: 1px dashed #ff6464;
            border-radius: 5px;
            color: #ff6464;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">💝 随心供养</h1>

        <!-- 纯CSS金色莲花 -->
        <div class="offering-container">
            <div id="offeringImg" class="offering-img offering-off">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="lotus-center"></div>
            </div>
        </div>

        <!-- 金额选择 -->
        <div class="amount-selector">
            <button class="amount-btn active" data-amount="1">1元</button>
            <button class="amount-btn" data-amount="6">6元</button>
            <button class="amount-btn" data-amount="18">18元</button>
            <button class="amount-btn" data-amount="68">68元</button>
            <button class="amount-btn" data-amount="188">188元</button>
            <input type="number" id="customAmount" class="custom-amount" placeholder="自定义金额" min="1">
        </div>

        <!-- 姓名和备注输入 -->
        <input type="text" id="donorName" class="name-input" placeholder="您的法名（留空为匿名）">
        <textarea id="donorRemark" class="remark-input" placeholder="您的心愿或备注（可选）"></textarea>
        <p class="input-hint">随心布施，功德无量</p>

        <!-- 供养按钮 -->
        <button id="donateBtn" class="donate-btn">随心供养</button>

        <!-- 功德流 -->
        <div class="merit-stream">
            <h2 class="merit-title">✨ 最近功德</h2>
            <div id="meritList" class="merit-list">
                <div class="merit-item">
                    <span class="merit-name">匿名信众</span>
                    <span>随心供养，功德+1</span>
                    <span class="merit-time">刚刚</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 通知容器 -->
    <div id="notificationContainer" class="notification-container"></div>

    <script>
        // 全局变量
        let selectedAmount = 1;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 金额选择逻辑
            const amountBtns = document.querySelectorAll('.amount-btn');
            const customAmountInput = document.getElementById('customAmount');

            amountBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    amountBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedAmount = parseFloat(this.dataset.amount);
                    customAmountInput.value = '';
                });
            });

            customAmountInput.addEventListener('input', function() {
                if (this.value && parseFloat(this.value) >= 1) {
                    amountBtns.forEach(b => b.classList.remove('active'));
                    selectedAmount = parseFloat(this.value);
                }
            });

            // 供养按钮点击
            document.getElementById('donateBtn').addEventListener('click', handleDonate);

            // 检查URL中是否有付款成功标记
            checkPaymentSuccess();
        });

        // 处理捐赠 - 仅修改此处，使用quantity参数传递任意金额
        async function handleDonate() {
            const name = document.getElementById('donorName').value.trim() || '匿名信眾';
            const btn = document.getElementById('donateBtn');

            // 金额合法性验证
            if (isNaN(selectedAmount) || selectedAmount < 1) {
                showNotification('请输入有效的金额（最低1元）', 'error');
                return;
            }

            // 禁用按钮防止重复点击
            btn.disabled = true;
            btn.textContent = '正在跳转付款...';

            // 基础产品链接（你提供的新链接）
            const basePayUrl = 'https://www.checkout-ds24.com/product/691620';
            // 把用户输入的金额作为数量传递（后台产品基础价格设为1元）
            const finalPayUrl = `${basePayUrl}?quantity=${Math.round(selectedAmount)}`;

            showNotification('正在跳转到付款页面...');
            // 本页直接跳转
            window.location.href = finalPayUrl;
        }

        // 检查URL中是否有付款成功标记
        function checkPaymentSuccess() {
            const urlParams = new URLSearchParams(window.location.search);
            const isSuccess = urlParams.get('success');
            const orderNo = urlParams.get('order_no');
            const name = urlParams.get('name');

            if (isSuccess === '1' && orderNo) {
                showNotification(`${name || '匿名信众'} 随心供养成功，功德无量`);
                activateOffering();
                addMeritItem(name || '匿名信众', '随心供养');

                // 清理URL参数
                window.history.replaceState({}, document.title, '/donate/custom');
            }
        }

        // 激活供养特效（莲花绽放）
        function activateOffering() {
            const offeringImg = document.getElementById('offeringImg');
            offeringImg.classList.remove('offering-off');
            offeringImg.classList.add('offering-on');
        }

        // 显示浮动通知
        function showNotification(message, type = 'success') {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;

            if (type === 'error') {
                notification.style.borderLeftColor = '#ff4444';
            }

            container.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // 添加功德流项目
        function addMeritItem(name, type) {
            const meritList = document.getElementById('meritList');
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const item = document.createElement('div');
            item.className = 'merit-item';
            item.innerHTML = `
                <span class="merit-name">${name}</span>
                <span>${type}，功德无量</span>
                <span class="merit-time">${timeStr}</span>
            `;

            meritList.prepend(item);

            if (meritList.children.length > 20) {
                meritList.removeChild(meritList.lastChild);
            }
        }
    </script>
</body>
</html>
