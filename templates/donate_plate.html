<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牌位供奉 - 赛博神宫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .page-title {
            font-size: 2.5rem;
            color: #ffd700;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* ========== 完美无黑角牌位 ========== */
        .plate-container {
            width: 250px;
            height: 350px;
            margin: 0 auto 40px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 牌位主体（单一div实现，无拼接） */
        .plate-img {
            width: 180px;
            height: 280px;
            /* 顶部完美弧形，底部直角 */
            border-radius: 90px 90px 0 0;
            /* 金色边框 */
            border: 3px solid #ffd700;
            /* 未点亮状态：棕色木纹 */
            background: linear-gradient(135deg, #8b4513, #d2691e);
            transition: all 0.5s ease;
            position: relative;
        }

        /* 未点亮状态 */
        .plate-off {
            filter: brightness(0.2);
            opacity: 0.5;
        }

        /* 点亮状态（完全匹配你提供的金色效果） */
        .plate-on {
            /* 金色渐变背景 */
            background: linear-gradient(135deg, #ff9900, #ffff00);
            /* 外围金色发光效果 */
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4),
                        0 0 40px rgba(255, 215, 0, 0.6),
                        0 0 60px rgba(255, 215, 0, 0.3);
            /* 呼吸发光动画 */
            animation: glow 2s infinite alternate;
            filter: brightness(1.2);
        }

        @keyframes glow {
            0% {
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.4),
                            0 0 40px rgba(255, 215, 0, 0.6);
            }
            100% {
                box-shadow: 0 0 30px rgba(255, 215, 0, 0.5),
                            0 0 60px rgba(255, 215, 0, 0.7),
                            0 0 80px rgba(255, 215, 0, 0.4);
            }
        }

        /* 牌位名称 */
        .plate-name {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #000000;
            font-size: 1.6rem;
            font-weight: bold;
            display: none;
            z-index: 10;
            width: 160px;
            text-align: center;
            line-height: 1.6;
            /* 轻微文字阴影增强可读性 */
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.3);
        }

        /* 金额选择 */
        .amount-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .amount-btn {
            padding: 12px 25px;
            border: 2px solid #333;
            background: #1a1a2e;
            color: #fff;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3;
        }

        .amount-btn:hover, .amount-btn.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }

        .custom-amount {
            width: 100%;
            max-width: 200px;
            padding: 12px;
            border: 2px solid #333;
            background: #1a1a2e;
            color: #fff;
            border-radius: 8px;
            font-size: 1.1rem;
            text-align: center;
            margin-top: 10px;
        }

        /* 姓名/牌位名输入 */
        .name-input {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            border: 2px solid #333;
            background: #1a1a2e;
            color: #fff;
            border-radius: 8px;
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .input-hint {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        /* 供奉按钮 */
        .donate-btn {
            padding: 15px 60px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
            border: none;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .donate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        .donate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 功德流区域 */
        .merit-stream {
            margin-top: 60px;
            text-align: left;
        }

        .merit-title {
            font-size: 1.5rem;
            color: #ffd700;
            margin-bottom: 20px;
            text-align: center;
        }

        .merit-list {
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .merit-item {
            padding: 10px;
            border-bottom: 1px solid #333;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .merit-name {
            color: #ffd700;
            font-weight: bold;
        }

        .merit-time {
            color: #666;
            font-size: 0.8rem;
            margin-left: 10px;
        }

        /* 全局浮动通知 */
        .notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notification {
            padding: 15px 25px;
            background: rgba(0, 0, 0, 0.8);
            border-left: 4px solid #ffd700;
            color: #fff;
            border-radius: 5px;
            animation: notifyIn 0.3s ease, notifyOut 0.3s ease 2.7s forwards;
        }

        @keyframes notifyIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes notifyOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100px); }
        }

        /* 测试模式提示 */
        .test-mode-notice {
            margin-top: 20px;
            padding: 10px;
            background: rgba(255, 100, 100, 0.1);
            border: 1px dashed #ff6464;
            border-radius: 5px;
            color: #ff6464;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">🏮 牌位供奉</h1>

        <!-- 完美无黑角牌位 -->
        <div class="plate-container">
            <div id="plateImg" class="plate-img plate-off"></div>
            <div id="plateName" class="plate-name"></div>
        </div>

        <!-- 金额选择 -->
        <div class="amount-selector">
            <button class="amount-btn active" data-amount="68">68元/月</button>
            <button class="amount-btn" data-amount="188">188元/季</button>
            <button class="amount-btn" data-amount="688">688元/年</button>
            <input type="number" id="customAmount" class="custom-amount" placeholder="自定义金额" min="1">
        </div>

        <!-- 牌位名输入 -->
        <input type="text" id="donorName" class="name-input" placeholder="请输入牌位名称">
        <p class="input-hint">可用于祈福、超度、纪念先人</p>

        <!-- 供奉按钮 -->
        <button id="donateBtn" class="donate-btn">立牌供奉</button>



        <!-- 功德流 -->
        <div class="merit-stream">
            <h2 class="merit-title">✨ 最近功德</h2>
            <div id="meritList" class="merit-list">
                <div class="merit-item">
                    <span class="merit-name">匿名信众</span>
                    <span>立牌供奉，功德无量</span>
                    <span class="merit-time">刚刚</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 通知容器 -->
    <div id="notificationContainer" class="notification-container"></div>

    <script>
        // 全局变量
        let selectedAmount = 68;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 金额选择逻辑
            const amountBtns = document.querySelectorAll('.amount-btn');
            const customAmountInput = document.getElementById('customAmount');

            amountBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    amountBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedAmount = parseFloat(this.dataset.amount);
                    customAmountInput.value = '';
                });
            });

            customAmountInput.addEventListener('input', function() {
                if (this.value && parseFloat(this.value) >= 1) {
                    amountBtns.forEach(b => b.classList.remove('active'));
                    selectedAmount = parseFloat(this.value);
                }
            });

            // 供奉按钮点击
            document.getElementById('donateBtn').addEventListener('click', handleDonate);

            // 检查URL中是否有付款成功标记
            checkPaymentSuccess();
        });

        // 处理捐赠 - 仅修改此处跳转方式（本页跳转，和上香页面完全一致）
        async function handleDonate() {
            const name = document.getElementById('donorName').value.trim() || '匿名信眾';
            const btn = document.getElementById('donateBtn');

            // 禁用按钮防止重复点击
            btn.disabled = true;
            btn.textContent = '正在跳转付款...';

            // 付款链接配置（按档位匹配）
            let payUrl = '';
            if (selectedAmount === 68) {
                payUrl = 'https://www.checkout-ds24.com/product/691610'; // 68元/月 付款链接
            } else if (selectedAmount === 188) {
                // payUrl = 'https://www.checkout-ds24.com/product/XXXXXX'; // 188元/季 付款链接（待填）
            } else if (selectedAmount === 688) {
                // payUrl = 'https://www.checkout-ds24.com/product/XXXXXX'; // 688元/年 付款链接（待填）
            }

            if (payUrl) {
                showNotification('正在跳转到付款页面...');
                // 本页直接跳转（和上香页面完全一致）
                window.location.href = payUrl;
            } else {
                showNotification('该档位暂未开放，敬请期待', 'error');
                btn.disabled = false;
                btn.textContent = '立牌供奉';
            }
        }

        // 检查URL中是否有付款成功标记
        function checkPaymentSuccess() {
            const urlParams = new URLSearchParams(window.location.search);
            const isSuccess = urlParams.get('success');
            const orderNo = urlParams.get('order_no');
            const name = urlParams.get('name');

            if (isSuccess === '1' && orderNo) {
                showNotification(`${name || '匿名信众'} 牌位供奉成功，功德无量`);
                activatePlate(name || '匿名信众');
                addMeritItem(name || '匿名信众', '立牌供奉');

                // 清理URL参数
                window.history.replaceState({}, document.title, '/donate/plate');
            }
        }

        // 点亮牌位（无倒计时，永久显示）
        function activatePlate(name) {
            const plateImg = document.getElementById('plateImg');
            const plateNameEl = document.getElementById('plateName');

            // 切换到点亮状态
            plateImg.classList.remove('plate-off');
            plateImg.classList.add('plate-on');

            // 显示牌位名称
            plateNameEl.textContent = name;
            plateNameEl.style.display = 'block';
        }

        // 显示浮动通知
        function showNotification(message, type = 'success') {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;

            if (type === 'error') {
                notification.style.borderLeftColor = '#ff4444';
            }

            container.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // 添加功德流项目
        function addMeritItem(name, type) {
            const meritList = document.getElementById('meritList');
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const item = document.createElement('div');
            item.className = 'merit-item';
            item.innerHTML = `
                <span class="merit-name">${name}</span>
                <span>${type}，功德无量</span>
                <span class="merit-time">${timeStr}</span>
            `;

            meritList.prepend(item);

            if (meritList.children.length > 20) {
                meritList.removeChild(meritList.lastChild);
            }
        }
    </script>
</body>
</html>
