<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>供灯祈福 - 赛博神宫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .page-title {
            font-size: 2.5rem;
            color: #ffd700;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* 供灯图片区域 */
        .lamp-container {
            width: 200px;
            height: 300px;
            margin: 0 auto 40px;
            position: relative;
        }

        .lamp-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: all 0.5s ease;
        }

        .lamp-off {
            filter: brightness(0.3);
        }

        .lamp-on {
            filter: brightness(1.2);
            animation: flicker 1s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 0.9; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        .countdown {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 15px;
            border-radius: 20px;
            color: #ffd700;
            font-size: 1.2rem;
            display: none;
        }

        /* 金额选择 */
        .amount-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .amount-btn {
            padding: 12px 25px;
            border: 2px solid #333;
            background: #1a1a2e;
            color: #fff;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3;
        }

        .amount-btn:hover, .amount-btn.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }

        .custom-amount {
            width: 100%;
            max-width: 200px;
            padding: 12px;
            border: 2px solid #333;
            background: #1a1a2e;
            color: #fff;
            border-radius: 8px;
            font-size: 1.1rem;
            text-align: center;
            margin-top: 10px;
        }

        /* 姓名输入 */
        .name-input {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            border: 2px solid #333;
            background: #1a1a2e;
            color: #fff;
            border-radius: 8px;
            font-size: 1.1rem;
            margin-bottom: 30px;
            text-align: center;
        }

        /* 供灯按钮 */
        .donate-btn {
            padding: 15px 60px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
            border: none;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .donate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        .donate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 功德流区域 */
        .merit-stream {
            margin-top: 60px;
            text-align: left;
        }

        .merit-title {
            font-size: 1.5rem;
            color: #ffd700;
            margin-bottom: 20px;
            text-align: center;
        }

        .merit-list {
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .merit-item {
            padding: 10px;
            border-bottom: 1px solid #333;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .merit-name {
            color: #ffd700;
            font-weight: bold;
        }

        .merit-time {
            color: #666;
            font-size: 0.8rem;
            margin-left: 10px;
        }

        /* 全局浮动通知 */
        .notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notification {
            padding: 15px 25px;
            background: rgba(0, 0, 0, 0.8);
            border-left: 4px solid #ffd700;
            color: #fff;
            border-radius: 5px;
            animation: notifyIn 0.3s ease, notifyOut 0.3s ease 2.7s forwards;
        }

        @keyframes notifyIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes notifyOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100px); }
        }

        /* 测试模式提示 */
        .test-mode-notice {
            margin-top: 20px;
            padding: 10px;
            background: rgba(255, 100, 100, 0.1);
            border: 1px dashed #ff6464;
            border-radius: 5px;
            color: #ff6464;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">🕯️ 供灯祈福</h1>

        <!-- 供灯图片 -->
        <div class="lamp-container">
            <img id="lampImg" class="lamp-img lamp-off" src="{{ url_for('static', filename='images/lamp_off.png') }}" alt="供灯">
            <div id="countdown" class="countdown">60s</div>
        </div>

        <!-- 金额选择 - 已修正圆满牌data-amount值 -->
        <div class="amount-selector">
            <button class="amount-btn active" data-amount="8">平安牌 8元</button>
            <button class="amount-btn" data-amount="18">祈福牌 18元</button>
            <button class="amount-btn" data-amount="68">圓滿牌 68元</button>
            <input type="number" id="customAmount" class="custom-amount" placeholder="自定义金额" min="1">
        </div>

        <!-- 姓名输入 -->
        <input type="text" id="donorName" class="name-input" placeholder="您的法名（留空为匿名）">

        <!-- 供灯按钮 -->
        <button id="donateBtn" class="donate-btn">点亮心灯</button>



        <!-- 功德流 -->
        <div class="merit-stream">
            <h2 class="merit-title">✨ 最近功德</h2>
            <div id="meritList" class="merit-list">
                <div class="merit-item">
                    <span class="merit-name">匿名信众</span>
                    <span>供灯一盏，功德+1</span>
                    <span class="merit-time">刚刚</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 通知容器 -->
    <div id="notificationContainer" class="notification-container"></div>

    <script>
        // 全局变量
        let selectedAmount = 8;
        let lampTimer = null;
        let remainingTime = 0;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 金额选择逻辑
            const amountBtns = document.querySelectorAll('.amount-btn');
            const customAmountInput = document.getElementById('customAmount');

            amountBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    amountBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedAmount = parseFloat(this.dataset.amount);
                    customAmountInput.value = '';
                });
            });

            customAmountInput.addEventListener('input', function() {
                if (this.value && parseFloat(this.value) >= 1) {
                    amountBtns.forEach(b => b.classList.remove('active'));
                    selectedAmount = parseFloat(this.value);
                }
            });

            // 供灯按钮点击
            document.getElementById('donateBtn').addEventListener('click', handleDonate);

            // 页面加载时，检查URL中是否有付款成功标记
            checkPaymentSuccess();
        });

        // 处理捐赠 - 三个档位全部配置完成，本页直接跳转
        async function handleDonate() {
            const name = document.getElementById('donorName').value.trim() || '匿名信眾';
            const btn = document.getElementById('donateBtn');

            // 禁用按钮防止重复点击
            btn.disabled = true;
            btn.textContent = '正在跳转付款...';

            // 付款链接配置（三个档位全部配置完成）
            let payUrl = '';
            if (selectedAmount === 8) {
                payUrl = 'https://www.checkout-ds24.com/product/691614'; // 平安牌 8元
            } else if (selectedAmount === 18) {
                payUrl = 'https://www.checkout-ds24.com/product/691616'; // 祈福牌 18元
            } else if (selectedAmount === 68) {
                payUrl = 'https://www.checkout-ds24.com/product/691618'; // 圆满牌 68元
            }

            if (payUrl) {
                showNotification('正在跳转到付款页面...');
                // 本页直接跳转（和牌位页面完全一致）
                window.location.href = payUrl;
            } else {
                showNotification('该档位暂未开放，敬请期待', 'error');
                btn.disabled = false;
                btn.textContent = '点亮心灯';
            }
        }

        // 检查URL中是否有付款成功标记
        function checkPaymentSuccess() {
            const urlParams = new URLSearchParams(window.location.search);
            const isSuccess = urlParams.get('success');
            const orderNo = urlParams.get('order_no');
            const name = urlParams.get('name');

            if (isSuccess === '1' && orderNo) {
                // 付款成功！点亮供灯
                showNotification(`${name || '匿名信众'} 供灯成功，功德+1`);
                startLampCountdown();
                addMeritItem(name || '匿名信众', '供灯');

                // 清理URL参数（防止刷新后再次触发）
                window.history.replaceState({}, document.title, '/donate/light');
            }
        }

        // 开始供灯倒计时
        function startLampCountdown() {
            const lampImg = document.getElementById('lampImg');
            const countdownEl = document.getElementById('countdown');

            // 切换到燃烧状态
            lampImg.src = "{{ url_for('static', filename='images/lamp_on.png') }}";
            lampImg.classList.remove('lamp-off');
            lampImg.classList.add('lamp-on');
            countdownEl.style.display = 'block';

            remainingTime = 60;
            countdownEl.textContent = `${remainingTime}s`;

            // 清除之前的定时器
            if (lampTimer) clearInterval(lampTimer);

            // 开始倒计时
            lampTimer = setInterval(() => {
                remainingTime--;
                countdownEl.textContent = `${remainingTime}s`;

                if (remainingTime <= 0) {
                    clearInterval(lampTimer);
                    // 切换回熄灭状态
                    lampImg.src = "{{ url_for('static', filename='images/lamp_off.png') }}";
                    lampImg.classList.remove('lamp-on');
                    lampImg.classList.add('lamp-off');
                    countdownEl.style.display = 'none';
                }
            }, 1000);
        }

        // 显示浮动通知
        function showNotification(message, type = 'success') {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;

            if (type === 'error') {
                notification.style.borderLeftColor = '#ff4444';
            }

            container.appendChild(notification);

            // 3秒后自动移除
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // 添加功德流项目
        function addMeritItem(name, type) {
            const meritList = document.getElementById('meritList');
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const item = document.createElement('div');
            item.className = 'merit-item';
            item.innerHTML = `
                <span class="merit-name">${name}</span>
                <span>${type}一盏，功德+1</span>
                <span class="merit-time">${timeStr}</span>
            `;

            // 置顶显示
            meritList.prepend(item);

            // 最多显示20条
            if (meritList.children.length > 20) {
                meritList.removeChild(meritList.lastChild);
            }
        }
    </script>
</body>
</html>
