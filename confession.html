<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>懺悔室 | 慧忍神宮</title>
    <style>
        /* 核心视觉：黑金神宫风格 */
        body {
            margin: 0;
            background-color: #000;
            color: #d4af37;
            font-family: "PingFang SC", "Microsoft YaHei", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .shrine-container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            letter-spacing: 15px;
            font-weight: 300;
            color: #fff;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 180px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #222;
            color: #ccc;
            padding: 20px;
            font-size: 1.1rem;
            line-height: 1.6;
            outline: none;
            resize: none;
            transition: 0.3s;
        }

        textarea:focus { border-color: #444; background: rgba(255,255,255,0.05); }

        .btn-submit {
            margin-top: 30px;
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 12px 60px;
            cursor: pointer;
            letter-spacing: 10px;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn-submit:hover { background: #d4af37; color: #000; }

        /* 回复展示区域 */
        #result-display {
            margin-top: 60px;
            display: none;
        }

        .zen-label {
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 5px;
            margin-bottom: 25px;
        }

        .zen-reply-content {
            font-size: 1.2rem;
            line-height: 2.2;
            color: #eee;
            margin-bottom: 40px;
            min-height: 50px;
        }

        /* 金色回执区域 */
        .receipt-area {
            font-size: 0.8rem;
            color: #d4af37;
            font-family: serif;
            letter-spacing: 2px;
            margin-top: 40px;
            opacity: 0;
            transition: opacity 1.5s ease;
            font-style: italic;
        }

        /* 付款/打赏区域样式 */
        .donation-wrap {
            margin-top: 35px;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .donation-btn {
            display: inline-block;
            color: #d4af37;
            text-decoration: none;
            font-size: 0.8rem;
            border: 1px solid #d4af37;
            padding: 10px 30px;
            letter-spacing: 2px;
            transition: 0.3s;
            cursor: pointer;
        }

        .donation-btn:hover {
            background: #d4af37;
            color: #000;
        }

        .back-link {
            display: block;
            margin-top: 40px;
            color: #fff;
            text-decoration: none;
            font-size: 0.8rem;
            padding-bottom: 30px;
        }

        .loading-text { color: #444; font-style: italic; }
    </style>
</head>
<body>

    <div class="shrine-container">
        <h1>懺 悔 室</h1>
        <textarea id="confess-input" placeholder="訴說你的執念..."></textarea>

        <div>
            <button class="btn-submit" onclick="processConfession()">交付因果</button>
        </div>

        <div id="result-display">
            <div class="zen-label">【 慧 忍 禪 師 感 應 】</div>

            <div id="zen-reply" class="zen-reply-content"></div>

            <div id="receipt-text" class="receipt-area"></div>

            <div id="donation-area" class="donation-wrap">
                <a href="https://www.checkout-ds24.com/redir/691619/AFFILIATE/CAMPAIGNKEY" target="_blank" id="actual-link" class="donation-btn">
                    隨 喜 供 養（ 結 清 因 果 ）
                </a>
            </div>
        </div>

        <a href="/shrine" class="back-link">← 返回內殿 / RETURN</a>
    </div>

    <script>
        let isTyping = false;

        async function processConfession() {
            if (isTyping) return;

            const input = document.getElementById('confess-input').value;
            const display = document.getElementById('result-display');
            const zenReply = document.getElementById('zen-reply');
            const receipt = document.getElementById('receipt-text');
            const donationArea = document.getElementById('donation-area');

            if (!input.trim()) return;

            // 1. 初始化界面状态
            display.style.display = 'block';
            zenReply.innerHTML = '<span class="loading-text">正在讀取業障代碼...</span>';
            receipt.style.opacity = '0';
            donationArea.style.opacity = '0';

            // 2. 兜底逻辑：如果 8 秒内 AI 没反应，强制显示付款链接，防止网页看起来像坏了
            const forceShowTimer = setTimeout(() => {
                if (donationArea.style.opacity == '0') {
                    donationArea.style.opacity = '1';
                }
            }, 8000);

            try {
                const response = await fetch('/api/confess', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: input })
                });

                const data = await response.json();

                if (response.ok) {
                    clearTimeout(forceShowTimer); // 成功拿到数据，清除兜底计时器
                    zenReply.innerText = '';

                    // 开始打字机效果
                    startTypeWriter(zenReply, data.zen_reply, () => {
                        // A. 打字结束后显示金色回执
                        receipt.innerText = data.receipt;
                        receipt.style.opacity = '1';

                        // B. 延迟 1.5 秒后显示打赏链接
                        setTimeout(() => {
                            donationArea.style.opacity = '1';
                        }, 1500);
                    });
                } else {
                    throw new Error("API 响应失败");
                }
            } catch (error) {
                console.error("Error:", error);
                zenReply.innerText = "此時因果波動，虛空無聲。唯有自省，方見本心。";
                // 发生错误（如超时）时，直接显示打赏链接
                setTimeout(() => {
                    donationArea.style.opacity = '1';
                }, 1000);
            }
        }

        // 打字机核心函数
        function startTypeWriter(element, text, onComplete) {
            isTyping = true;
            let i = 0;
            const speed = 50;

            function type() {
                if (i < text.length) {
                    element.innerText += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else {
                    isTyping = false;
                    if (onComplete) onComplete();
                }
            }
            type();
        }
    </script>
</body>
</html>
